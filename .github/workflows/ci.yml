name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python
        run: python3 -m compileall -q .claude/skills/semantic-compressor/scripts scripts tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Project integrity
        run: python3 scripts/validate_project.py
