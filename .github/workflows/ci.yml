name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Compile Python
        run: python3 -m compileall -q .claude/skills/semantic-compressor/scripts scripts tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Project integrity
        run: python3 scripts/validate_project.py
      - name: Control script smoke test
        run: |
          script=.claude/skills/semantic-compressor/scripts/semantic_compressor.py
          python3 "$script" --version
          python3 "$script" discover --root . --exclude .claude/skills/semantic-compressor
          python3 "$script" benchmark --samples .claude/skills/semantic-compressor/samples \
            --format markdown --output BENCHMARK-REPORT.md --check
